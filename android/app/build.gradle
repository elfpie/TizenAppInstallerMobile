apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react { autolinkLibrariesWithApp() }

def signingPath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
def configString = { value -> '"' + (value ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"' }
if (releaseRequested && !signingPath) {
    throw new GradleException("Release builds require ANDROID_KEYSTORE_PATH and signing credentials. See README.md.")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.tizenappinstallermobile"
    testBuildType "preview"
    defaultConfig {
        applicationId "com.tizenappinstallermobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "1")
        versionName = System.getenv("ANDROID_VERSION_NAME") ?: "0.1.3"
        buildConfigField "String", "DIAGNOSTICS_URL", configString(System.getenv("ANDROID_DIAGNOSTICS_URL"))
        buildConfigField "String", "DIAGNOSTICS_WRITE_KEY", configString(System.getenv("ANDROID_DIAGNOSTICS_WRITE_KEY"))
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (signingPath) {
            release {
                storeFile file(signingPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        preview {
            initWith release
            signingConfig signingConfigs.debug
            applicationIdSuffix ".preview"
            matchingFallbacks = ['release']
        }
        release {
            if (signingPath) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    packaging { resources.excludes += ["META-INF/versions/9/OSGI-INF/MANIFEST.MF"] }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("org.bouncycastle:bcpkix-jdk18on:1.83")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.apache.santuario:xmlsec:3.0.6")
    testImplementation("org.json:json:20250517")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
}
