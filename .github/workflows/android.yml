name: Android APK
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Reserve disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell "${ANDROID_HOME:?}/ndk"
          df -h /
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
      - run: npm ci
      - name: Test private diagnostic collector
        run: python3 -m unittest discover -s diagnostics -v
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Test transport and signing; build standalone APK
        working-directory: android
        env:
          # Public APKs never contain a private collector endpoint or write key.
          ANDROID_DIAGNOSTICS_URL: ''
          ANDROID_DIAGNOSTICS_WRITE_KEY: ''
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 0.1.3-preview.${{ github.run_number }}
        run: ./gradlew testPreviewUnitTest assemblePreview --console=plain --max-workers=4
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Start read-only fake TV
        run: python3 -u scripts/fake-tv.py > "$RUNNER_TEMP/fake-tv.log" 2>&1 &
      - name: Test the standalone APK on Android with a restrictive VPN
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_DIAGNOSTICS_URL: ''
          ANDROID_DIAGNOSTICS_WRITE_KEY: ''
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 0.1.3-preview.${{ github.run_number }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd android && ./gradlew connectedPreviewAndroidTest --console=plain --max-workers=4
      - name: Package APK and checksum
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/preview/app-preview.apk artifacts/tizen-pocket-preview.apk
          cd artifacts
          sha256sum tizen-pocket-preview.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tizen-pocket-preview-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
      - run: npm ci
      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Configure the Android signing secrets documented in README.md."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tizen-pocket.keystore"
      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tizen-pocket.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_DIAGNOSTICS_URL: ''
          ANDROID_DIAGNOSTICS_WRITE_KEY: ''
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export ANDROID_VERSION_NAME="${RELEASE_TAG#v}"
          ./gradlew assembleRelease --console=plain --max-workers=4
      - name: Package signed APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/tizen-pocket.apk
          cd artifacts
          sha256sum tizen-pocket.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tizen-pocket-release
          path: artifacts/
          if-no-files-found: error
      - name: Publish versioned APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/tizen-pocket.apk artifacts/SHA256SUMS --verify-tag --generate-notes
      - name: Remove decoded signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tizen-pocket.keystore"
